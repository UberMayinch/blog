{{ define "main" }}
<div class="welcome">
  <h1 class="welcome-title">{{ .Title }}</h1>
  <ul class="recent">
    {{- range .Pages }}
    {{- $f := partial "filename.html" . }}
    <li>
      <a href="{{ .RelPermalink }}">
        <span class="file-icon file-icon--{{ $f.icon }}">{{ partial "icon.html" $f.icon }}</span>
        <span class="recent-title">{{ .Title }}</span>
        <span class="recent-file">{{ $f.name }}</span>
        <span class="recent-date">{{ .Date.Format "Jan 2, 2006" }}</span>
      </a>
    </li>
    {{- end }}
  </ul>
</div>
{{ end }}
