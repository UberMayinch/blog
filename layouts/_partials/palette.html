{{- /* Ctrl+K quick-open palette. Filled by static/js/notebook.js from index.json. */ -}}
<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
    <input class="palette-input" id="palette-input" type="text" autocomplete="off" spellcheck="false"
           placeholder="Search posts and cells  ·  &gt; for commands" aria-controls="palette-list">
    <ul class="palette-list" id="palette-list" role="listbox"></ul>
    <div class="palette-hint"><kbd>↑</kbd><kbd>↓</kbd> navigate · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</div>
  </div>
</div>
