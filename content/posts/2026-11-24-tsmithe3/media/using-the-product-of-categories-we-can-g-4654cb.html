<!doctype html>
<html class="dark" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The hom functor C(−,=) on C^op × C</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.2/dist/katex.min.css">
<style>
html, body { margin: 0; background: #14161b; color: #e8e8e8; font-family: system-ui, sans-serif; }
#lab-root { padding: 12px; }
#lab-root .lab { --foreground: #e8e8e8; --muted-foreground: #9aa0a6; --border: #ffffff1a; --card: transparent; max-width: none; border: 0; padding: 0; }
.lab-btn { color: inherit; }
.lab {
  --lab-blue: #2b8fb8; --lab-yellow: #b38f00; --lab-green: #3f8f2f; --lab-red: #d64136; --lab-pink: #d4428a;
  --lab-teal: #1f9c80; --lab-orange: #d9661a; --lab-purple: #7d55a0; --lab-grey: #6b7280;
  --lab-grid: color-mix(in srgb, var(--foreground, #111) 9%, transparent);
  --lab-axis: color-mix(in srgb, var(--foreground, #111) 38%, transparent);
  color: var(--foreground, inherit); font-size: 14px; line-height: 1.5;
  border: 1px solid var(--border, #ddd); border-radius: 12px; padding: 12px; background: var(--card, transparent);
  display: flex; flex-direction: column; gap: 10px; outline: none; max-width: 44rem;
}
.dark .lab {
  --lab-blue: #58c4dd; --lab-yellow: #f4d345; --lab-green: #83c167; --lab-red: #fc6255; --lab-pink: #ff77b4;
  --lab-teal: #5cd0b3; --lab-orange: #ff862f; --lab-purple: #b08fd0; --lab-grey: #9aa0a6;
}
.lab:focus-visible { box-shadow: 0 0 0 2px var(--ring, #888); }
.lab-failed { color: var(--muted-foreground, #666); font-size: 13px; }
.lab-title { font-weight: 600; }
.lab-stage { position: relative; width: 100%; }
.lab-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
.lab-overlay { position: absolute; inset: 0; pointer-events: none; }
.lab-gridline { stroke: var(--lab-grid); stroke-width: 1; }
.lab-axis { stroke: var(--lab-axis); stroke-width: 1.4; }
.lab-tick { position: absolute; font-size: 10px; color: var(--muted-foreground, #888); white-space: nowrap; }
.lab-tick-x { transform: translate(-50%, 3px); }
.lab-tick-y { transform: translate(calc(-100% - 4px), -50%); }

.lab .c-blue { --c: var(--lab-blue); } .lab .c-yellow { --c: var(--lab-yellow); } .lab .c-green { --c: var(--lab-green); }
.lab .c-red { --c: var(--lab-red); } .lab .c-pink { --c: var(--lab-pink); } .lab .c-teal { --c: var(--lab-teal); }
.lab .c-orange { --c: var(--lab-orange); } .lab .c-purple { --c: var(--lab-purple); } .lab .c-grey { --c: var(--lab-grey); }
.lab-stroke { stroke: var(--c); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.lab-fill { fill: var(--c); }
.lab-area { fill: color-mix(in srgb, var(--c) 18%, transparent); }
.lab-nofill { fill: none; }
.lab-label { position: absolute; transform: translate(-50%, -50%); color: var(--c); font-weight: 600; font-size: 13px; white-space: nowrap; }

.lab-enter { animation: lab-enter 0.7s ease-out both; }
@keyframes lab-enter { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
.lab-obj { transform-box: fill-box; transform-origin: center; }
.lab-hl .lab-stroke { stroke-width: 4.2; }
.lab-hl { animation: lab-pulse 1.4s ease-in-out infinite; }
@keyframes lab-pulse { 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { .lab-enter, .lab-hl { animation: none; } }

.lab-text { min-height: 2.6em; }
.lab-caption { margin: 0; }
.lab-formula:empty { display: none; }
.lab-formula .katex-display { margin: 4px 0 0; }
.lab-sliders:empty { display: none; }
.lab-sliders { display: grid; gap: 6px; }
.lab-slider { display: grid; grid-template-columns: minmax(3rem, auto) 1fr 3.5rem; align-items: center; gap: 10px; font-size: 13px; }
.lab-slider input { width: 100%; accent-color: var(--primary, currentColor); }
.lab-slider output { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted-foreground, #666); }
.lab-controls { display: flex; align-items: center; gap: 8px; }
.lab-counter { font-variant-numeric: tabular-nums; color: var(--muted-foreground, #666); font-size: 13px; min-width: 3.5rem; text-align: center; }
.lab-btn {
  border: 1px solid var(--border, #ccc); background: transparent; color: inherit; border-radius: 8px;
  padding: 2px 10px; font-size: 13px; cursor: pointer; min-height: 28px;
}
.lab-btn:disabled { opacity: 0.4; cursor: default; }
.lab-btn:hover:not(:disabled) { background: var(--muted, rgba(0,0,0,.05)); }

</style></head>
