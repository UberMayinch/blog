baseURL = "https://ubermayinch.github.io/blog/"
locale = "en-us"
title = "rhizoMorphic"

enableEmoji = true
# Existing post URLs are mixed-case (/posts/2024-9-27-Variational-Bayes/).
disablePathToLower = true
# Daily posts are dated in IST; without this, a post dated today can be
# "in the future" relative to the UTC CI runner and silently skipped.
buildFuture = true
disableKinds = ["taxonomy", "term", "sitemap"]

# home.json is the Ctrl+K search index (layouts/home.json).
[outputs]
  home = ["html", "rss", "json"]

[params]
  author = "Chinmay Sharma"
  email = "chinmay.sharma@research.iiit.ac.in"
  description = "rhizoMorphic: Chinmay Sharma's Technical Blog."

[markup]
  [markup.highlight]
    # CSS classes, colored by static/css/chroma.css so the theme can toggle.
    noClasses = false
    style = "github-dark"
    lineNos = false
    tabWidth = 2

  [markup.goldmark.renderer]
    # Posts contain hand-written HTML (e.g. <br>, <sup>) from the Jekyll era.
    unsafe = true

  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]

[menus]
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 10
